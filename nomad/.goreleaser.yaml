# The nomad plugin's release build. goreleaser OSS cannot take its version from a nomad/v* tag, so it runs as a
# snapshot with VERSION, the tag less its nomad/ prefix: .github/workflows/release.yml builds and signs with it, then
# publishes against the prefixed tag; ci.yml's release-build job checks it and runs it with a placeholder VERSION.
version: 2

project_name: wherry-plugin-nomad

snapshot:
  version_template: "{{ .Env.VERSION }}"

builds:
  - id: wherry-plugin-nomad
    dir: nomad
    binary: wherry-plugin-nomad
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -X main.version={{ .Env.VERSION }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
archives:
  - id: wherry-plugin-nomad
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    files:
      - LICENSE
      - src: nomad/README.md
        strip_parent: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive
    # The binary in an archive names its Go modules but not their licences, which the remote search reads from the
    # module proxy. Setting env replaces goreleaser's default for archives, the file metadata cataloger, so it is kept.
    env:
      - SYFT_FILE_METADATA_CATALOGER_ENABLED=true
      - SYFT_GOLANG_SEARCH_REMOTE_LICENSES=true

# Keyless, through the release workflow's OIDC token; ci.yml's snapshot build skips it. Verify with:
#   cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/benemon/wherry-plugins/\.github/workflows/release\.yml@' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, --yes, "--bundle=${signature}", "${artifact}"]

# The release workflow publishes against the nomad/v* tag.
release:
  disable: true
changelog:
  disable: true
