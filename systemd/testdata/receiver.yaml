capacity: 2
platforms:
  # Every adapter on this platform takes these keys into its config, and
  # repeats none of them.
  - name: systemd
    type: systemd
    config:
      # Required while any adapter on the platform sets a credential.
      credential_env: ANTHROPIC_API_KEY
adapters:
  # Claude Code, each run as a dynamic user of its own.
  - name: host
    platform: systemd
    agent: coder
    credential: model-api-key
    labels:
      platform: systemd
    config:
      runtime:
        command: [/bin/sh, -c]
        args:
          - >-
            test -n "$WHERRY_MODEL" || WHERRY_MODEL=haiku;
            exec /usr/local/bin/claude -p --output-format stream-json --verbose --model "$WHERRY_MODEL" < /wherry/prompt.txt
        env:
          SHELL: /bin/bash
          DISABLE_AUTOUPDATER: "1"
        resources:
          cpu_quota: 100
          memory_mb: 2048
  # An agent that needs a provisioned identity, run as a fixed user that
  # every run of the adapter shares.
  - name: provisioned
    platform: systemd
    agent: reviewer
    output: file
    reply_file: reply.md
    labels:
      platform: systemd-provisioned
    config:
      runtime:
        user: wherry-agent
        group: wherry-agent
        supplementary_groups: [video]
        command: [/usr/local/bin/agent-run, --prompt-file, /wherry/prompt.txt]
