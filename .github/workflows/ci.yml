name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The wherry release the nomad-image job builds with and the systemd-host job installs; e2e.yml pins the same
  # release, so change both together.
  WHERRY_VERSION: v0.1.0

jobs:
  nomad-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find changes to the Nomad example or its source
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: .github/changed.sh "$BASE" '^(examples/nomad/|nomad/|\.github/workflows/ci\.yml$)'
      - name: Build the Nomad receiver image
        if: steps.changes.outputs.changed == 'true'
        run: docker build -f examples/nomad/Containerfile --build-arg WHERRY_VERSION="$WHERRY_VERSION" .

  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [nomad, kubernetes, systemd]
    env:
      PLUGIN: ${{ matrix.plugin }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find changes to the plugin or the shared build files
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          .github/changed.sh "$BASE"
          "^($PLUGIN/|examples/$PLUGIN/|Makefile\$|\.github/(check-examples|plugin-protocol(-test)?)\.sh\$|\.github/workflows/ci\.yml\$|\.github/changed\.sh\$)"
      - name: Set up Go
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ matrix.plugin }}/go.mod
          check-latest: true
          cache: true
          cache-dependency-path: ${{ matrix.plugin }}/go.sum
      - name: Run the plugin's gates
        if: steps.changes.outputs.changed == 'true'
        run: make check PLUGINS="$PLUGIN"

  # The plugin's release build as a snapshot, unsigned and unpublished, so a platform that stops compiling or an
  # archive that changes fails here before a tag.
  release-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [nomad, kubernetes, systemd]
    env:
      PLUGIN: ${{ matrix.plugin }}
      # A placeholder; release.yml takes it from the tag.
      VERSION: v0.0.0-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find changes to the plugin or the release build
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          .github/changed.sh "$BASE"
          "^($PLUGIN/|\.github/release-|\.github/workflows/(ci|release)\.yml\$|\.github/changed\.sh\$)"
      - name: Set up Go
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ matrix.plugin }}/go.mod
          check-latest: true
          cache: true
          cache-dependency-path: ${{ matrix.plugin }}/go.sum
      - name: Install goreleaser, syft and cosign
        if: steps.changes.outputs.changed == 'true'
        run: |
          .github/release-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Check the goreleaser configuration
        if: steps.changes.outputs.changed == 'true'
        run: goreleaser check --config "$PLUGIN/.goreleaser.yaml"
      - name: Build a snapshot release
        if: steps.changes.outputs.changed == 'true'
        run: goreleaser release --snapshot --clean --skip=sign --config "$PLUGIN/.goreleaser.yaml"
      - name: Compare the archives with the last release's
        if: steps.changes.outputs.changed == 'true'
        run: |
          .github/release-contents.sh dist | tee "$RUNNER_TEMP/release-contents.txt"
          diff -u ".github/release-contents/$PLUGIN.txt" "$RUNNER_TEMP/release-contents.txt"

  # The systemd plugin's real-host suite, as root on the runner's systemd, then systemd/README.md's install, upgrade and
  # rollback of the receiver as a systemd service, from the previous release to the checkout and back.
  systemd-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # cosign alone, at the version and SHA-256 of the linux-amd64 binary .github/release-tools.sh pins; change both
      # together.
      COSIGN_VERSION: 3.1.4
      COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find changes to the plugin or the shared build files
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          .github/changed.sh "$BASE"
          "^(systemd/|examples/systemd/|Makefile\$|\.github/workflows/ci\.yml\$|\.github/changed\.sh\$|\.github/plugin-protocol\.sh\$)"
      - name: Set up Go
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: systemd/go.mod
          check-latest: true
          cache: true
          cache-dependency-path: systemd/go.sum
      - name: Prepare the host as the plugin's README installs it
        if: steps.changes.outputs.changed == 'true'
        run: |
          systemctl --version
          systemctl is-system-running || true
          sudo install -d -m 0700 /run/wherry-systemd /var/lib/private
          sudo install -d -m 0755 /var/lib/private/wherry-agents /var/lib/wherry-agents /run/wherry/credentials /wherry
      - name: Build the real-host suite and the plugin
        if: steps.changes.outputs.changed == 'true'
        working-directory: systemd
        run: |
          GOOS=linux go test -c -o "$RUNNER_TEMP/systemd.test" .
          GOOS=linux go build -trimpath -o "$RUNNER_TEMP/wherry-plugin-systemd" .
      - name: Run the real-host suite as root
        if: steps.changes.outputs.changed == 'true'
        working-directory: systemd
        run: >-
          sudo env WHERRY_SYSTEMD_DEV=1 WHERRY_SYSTEMD_PLUGIN="$RUNNER_TEMP/wherry-plugin-systemd"
          "$RUNNER_TEMP/systemd.test" -test.count=1 -test.v -test.run 'OnSystemd|Conformance|Transient|DaemonReload|TwoRuns|UnitPropertiesOn'
      # The steps below need the tags for the previous release, which fetch-depth: 0 fetched, Go, for the plugin
      # protocol check's download of pluginsdk, and cosign, which verifies the wherry and plugin releases as the
      # README's commands do. 05 and 06 skip, with the check's notice, and 04 installs the checkout's plugin, when the
      # previous release and the checkout serve no plugin protocol in common; any failure of the check fails 02.
      - name: Install cosign
        if: steps.changes.outputs.changed == 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cosign" "https://github.com/sigstore/cosign/releases/download/v$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  $RUNNER_TEMP/cosign" | sha256sum -c -
          install -D -m 0755 "$RUNNER_TEMP/cosign" "$RUNNER_TEMP/bin/cosign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Start Kafka
        if: steps.changes.outputs.changed == 'true'
        run: systemd/test/e2e/01-broker.sh
      - name: Fetch and verify wherry and the previous release's plugin, and build the checkout's
        if: steps.changes.outputs.changed == 'true'
        run: systemd/test/e2e/02-fetch.sh
      - name: Provision the pool, tenant and host
        if: steps.changes.outputs.changed == 'true'
        run: systemd/test/e2e/03-provision.sh
      - name: Install and start the receiver as a systemd service
        if: steps.changes.outputs.changed == 'true'
        run: systemd/test/e2e/04-install.sh
      - name: Upgrade the receiver to the checkout's plugin
        if: steps.changes.outputs.changed == 'true'
        run: systemd/test/e2e/05-upgrade.sh
      - name: Roll the receiver back to the previous release's plugin
        if: steps.changes.outputs.changed == 'true'
        run: systemd/test/e2e/06-rollback.sh
      - name: Collect the receiver's journal and status and the broker's log
        if: failure() && steps.changes.outputs.changed == 'true'
        run: systemd/test/e2e/collect.sh
      - name: Upload the collected state
        if: failure() && steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-systemd-state
          path: ${{ runner.temp }}/wherry-systemd-e2e/artifacts
          retention-days: 7
