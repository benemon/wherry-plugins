name: e2e

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The wherry release whose CLI provisions and submits, and which the receiver image holds.
  WHERRY_VERSION: v0.1.0-rc.6
  KIND_VERSION: v0.33.0
  KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find changes to the Kubernetes plugin or the shared build files
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: .github/changed.sh "$BASE" '^(kubernetes/|Makefile$|\.github/workflows/e2e\.yml$|\.github/changed\.sh$)'
      - name: Install kind
        if: steps.changes.outputs.changed == 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kind" "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64"
          echo "$KIND_SHA256  $RUNNER_TEMP/kind" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/kind" /usr/local/bin/kind
      - name: Create the cluster and Kafka
        if: steps.changes.outputs.changed == 'true'
        run: kubernetes/test/e2e/01-cluster.sh
      - name: Fetch the wherry CLI
        if: steps.changes.outputs.changed == 'true'
        run: kubernetes/test/e2e/02-wherry.sh
      - name: Provision the pool, tenant, host and receiver
        if: steps.changes.outputs.changed == 'true'
        run: kubernetes/test/e2e/03-provision.sh
      - name: Build, load and deploy the receiver
        if: steps.changes.outputs.changed == 'true'
        run: kubernetes/test/e2e/04-deploy.sh
      - name: Submit and await the runs
        if: steps.changes.outputs.changed == 'true'
        run: kubernetes/test/e2e/05-runs.sh
      - name: Collect the receiver log and cluster state
        if: failure() && steps.changes.outputs.changed == 'true'
        run: kubernetes/test/e2e/collect.sh
      - name: Upload the collected state
        if: failure() && steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-state
          path: ${{ runner.temp }}/wherry-e2e/artifacts
          retention-days: 7
