name: e2e

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The wherry release whose CLI provisions and submits, and which the receiver image holds.
  # ci.yml's nomad-image job pins the same release; change both together.
  WHERRY_VERSION: v0.1.0-rc.28
  KIND_VERSION: v0.33.0
  KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
  # A Nomad CE release; NOMAD_SHA256 is its linux_amd64 zip's line in the release's SHA256SUMS.
  NOMAD_VERSION: 2.1.1
  NOMAD_SHA256: 073084f7690fdaea756ff1eff8b669b25c3a6c17778f19ae0c47606973ed3f39
  # The CNI reference plugins Nomad's bridge networking runs; CNI_PLUGINS_SHA256 is the linux-amd64 archive's .sha256.
  CNI_PLUGINS_VERSION: v1.9.1
  CNI_PLUGINS_SHA256: b98f74a0f8522f0a83867178729c1aa70f2158f90c45a2ca8fa791db1c76b303

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The upgrade starts from the latest kubernetes/v* tag.
          fetch-depth: 0
          persist-credentials: false
      - name: Find changes to the Kubernetes plugin or the shared build files
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          .github/changed.sh "$BASE"
          '^(kubernetes/|examples/kubernetes/|Makefile$|\.github/workflows/e2e\.yml$|\.github/(changed|plugin-protocol)\.sh$)'
      # .github/plugin-protocol.sh downloads the pluginsdk module each side requires, to compare their protocols.
      - name: Set up Go
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: kubernetes/go.mod
          check-latest: true
          cache: false
      - name: Install kind
        if: steps.changes.outputs.changed == 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kind" "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64"
          echo "$KIND_SHA256  $RUNNER_TEMP/kind" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/kind" /usr/local/bin/kind
      - name: Create the cluster and Kafka
        if: steps.changes.outputs.changed == 'true'
        run: kubernetes/test/e2e/01-cluster.sh
      - name: Fetch the wherry CLI and build the images, the checkout's and the previous release's
        if: steps.changes.outputs.changed == 'true'
        run: kubernetes/test/e2e/02-wherry.sh
      - name: Provision the pool, tenant, host and receiver
        if: steps.changes.outputs.changed == 'true'
        run: kubernetes/test/e2e/03-provision.sh
      - name: Load and deploy the receiver
        if: steps.changes.outputs.changed == 'true'
        run: kubernetes/test/e2e/04-deploy.sh
      - name: Submit and wait for the runs
        if: steps.changes.outputs.changed == 'true'
        run: kubernetes/test/e2e/05-runs.sh
      # 06 and 07 skip, with a notice, when the previous release serves another plugin protocol.
      - name: Upgrade from the previous release
        if: steps.changes.outputs.changed == 'true'
        run: kubernetes/test/e2e/06-upgrade.sh
      - name: Roll back to the previous release
        if: steps.changes.outputs.changed == 'true'
        run: kubernetes/test/e2e/07-rollback.sh
      - name: Collect the receiver log and cluster state
        if: failure() && steps.changes.outputs.changed == 'true'
        run: kubernetes/test/e2e/collect.sh
      - name: Upload the collected state
        if: failure() && steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-state
          path: ${{ runner.temp }}/wherry-e2e/artifacts
          retention-days: 7

  nomad:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The upgrade starts from the latest nomad/v* tag.
          fetch-depth: 0
          persist-credentials: false
      - name: Find changes to the Nomad plugin, its example or the fake agent
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          .github/changed.sh "$BASE"
          '^(nomad/|examples/nomad/|kubernetes/test/e2e/agent/|\.github/workflows/e2e\.yml$|\.github/(changed|plugin-protocol)\.sh$)'
      # .github/plugin-protocol.sh downloads the pluginsdk module each side requires, to compare their protocols.
      - name: Set up Go
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: nomad/go.mod
          check-latest: true
          cache: false
      - name: Install Nomad
        if: steps.changes.outputs.changed == 'true'
        run: |
          zip=nomad_${NOMAD_VERSION}_linux_amd64.zip
          curl -fsSL --output-dir "$RUNNER_TEMP" -O "https://releases.hashicorp.com/nomad/$NOMAD_VERSION/$zip"
          cd "$RUNNER_TEMP"
          echo "$NOMAD_SHA256  $zip" | sha256sum -c -
          unzip -o "$zip" nomad
          sudo install -m 0755 nomad /usr/local/bin/nomad
      - name: Install the CNI reference plugins
        if: steps.changes.outputs.changed == 'true'
        run: |
          archive=cni-plugins-linux-amd64-$CNI_PLUGINS_VERSION.tgz
          curl -fsSL --output-dir "$RUNNER_TEMP" -O \
            "https://github.com/containernetworking/plugins/releases/download/$CNI_PLUGINS_VERSION/$archive"
          cd "$RUNNER_TEMP"
          echo "$CNI_PLUGINS_SHA256  $archive" | sha256sum -c -
          sudo install -d -m 0755 /opt/cni/bin
          sudo tar -xzf "$archive" -C /opt/cni/bin
      - name: Start the Nomad agent and Kafka
        if: steps.changes.outputs.changed == 'true'
        run: nomad/test/e2e/01-nomad.sh
      - name: Fetch the wherry CLI and build the images
        if: steps.changes.outputs.changed == 'true'
        run: nomad/test/e2e/02-wherry.sh
      - name: Provision the pool, tenant, host and receiver
        if: steps.changes.outputs.changed == 'true'
        run: nomad/test/e2e/03-provision.sh
      - name: Validate the example jobs and run the receiver
        if: steps.changes.outputs.changed == 'true'
        run: nomad/test/e2e/04-deploy.sh
      - name: Submit and wait for a run
        if: steps.changes.outputs.changed == 'true'
        run: nomad/test/e2e/05-run.sh
      # 06 and 07 skip, with a notice, when the previous release serves another plugin protocol.
      - name: Upgrade from the previous release with a run in flight
        if: steps.changes.outputs.changed == 'true'
        run: nomad/test/e2e/06-upgrade.sh
      - name: Roll back to the previous release
        if: steps.changes.outputs.changed == 'true'
        run: nomad/test/e2e/07-rollback.sh
      - name: Collect the Nomad and receiver logs and the jobs' state
        if: failure() && steps.changes.outputs.changed == 'true'
        run: nomad/test/e2e/collect.sh
      - name: Upload the collected state
        if: failure() && steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-nomad-state
          path: ${{ runner.temp }}/wherry-nomad-e2e/artifacts
          retention-days: 7
