name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (go)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: kubernetes/go.mod
          check-latest: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: go
          build-mode: manual

      - name: Build the Nomad plugin
        working-directory: nomad
        run: go build ./...

      - name: Build the Kubernetes plugin
        working-directory: kubernetes
        run: go build ./...

      - name: Build the systemd plugin
        working-directory: systemd
        run: go build ./...

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          category: "/language:go"
