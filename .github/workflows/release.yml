name: release

# A <plugin>/v* tag is that plugin's release act; the prefix is the Go
# module's directory, which its version tags must carry, and names the
# plugin the release builds. Tags with a hyphenated qualifier
# (nomad/v0.1.0-rc.1) publish a prerelease. The build lives in
# <plugin>/.goreleaser.yaml, which goreleaser runs as a snapshot versioned
# from the tag less its prefix, since goreleaser OSS takes no version from a
# prefixed tag; this workflow publishes what it built against the tag.
on:
  push:
    tags: ['nomad/v*', 'kubernetes/v*', 'systemd/v*']

permissions:
  contents: read

jobs:
  # Publishes only a commit whose push to main finished green. It queries
  # rather than re-runs. The tag reaches the shell through the environment
  # and is checked before use, since git accepts tag names that would escape
  # any quoting.
  validate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a green ci run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in (*[!A-Za-z0-9._/-]*) echo "refusing tag: $RELEASE_TAG"; exit 1;; esac
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          conclusion=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&status=completed" \
            --jq '.workflow_runs[0].conclusion // "absent"')
          if [ "$conclusion" != "success" ]; then
            echo "ci for $sha concluded: $conclusion (need: success)." >&2
            echo "Tag a commit whose push to main finished green; 'absent' means no completed run exists yet." >&2
            exit 1
          fi
          echo "ci for $sha concluded success"

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write      # release creation and asset upload
      id-token: write      # provenance attestation and keyless signing
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # goreleaser reads the tags from the history, which a shallow clone lacks.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: kubernetes/go.mod
          check-latest: true
          cache: true
      - name: Pick the plugin and version from the tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in (*[!A-Za-z0-9._/-]*) echo "refusing tag: $RELEASE_TAG"; exit 1;; esac
          case "$RELEASE_TAG" in (nomad/v*|kubernetes/v*|systemd/v*) ;; (*) echo "refusing tag: $RELEASE_TAG"; exit 1;; esac
          case "${RELEASE_TAG#*/}" in (*/*) echo "refusing tag: $RELEASE_TAG"; exit 1;; esac
          echo "PLUGIN=${RELEASE_TAG%%/*}" >> "$GITHUB_ENV"
          echo "VERSION=${RELEASE_TAG#*/}" >> "$GITHUB_ENV"
      - name: Install goreleaser, syft and cosign
        run: |
          .github/release-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # A snapshot publishes nothing; VERSION names the archives.
      - name: Build and sign the release archives
        run: goreleaser release --snapshot --clean --config "$PLUGIN/.goreleaser.yaml"
      # Verify with:
      #   gh attestation verify wherry-plugin-<plugin>_<version>_<os>_<arch>.tar.gz -R benemon/wherry-plugins
      - name: Attest the archives' provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/wherry-plugin-*_*.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in (*[!A-Za-z0-9._/-]*) echo "refusing tag: $RELEASE_TAG"; exit 1;; esac
          prerelease=""
          case "$RELEASE_TAG" in (*-*) prerelease="--prerelease";; esac
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes $prerelease
          gh release upload "$RELEASE_TAG" --clobber \
            dist/wherry-plugin-"$PLUGIN"_*.tar.gz dist/wherry-plugin-"$PLUGIN"_*.tar.gz.sbom.json \
            dist/checksums.txt dist/checksums.txt.sigstore.json
