name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '29 3 * * 1'

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          check-latest: true

      - name: Run govulncheck on the Nomad plugin
        working-directory: nomad
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Run govulncheck on the Kubernetes plugin
        working-directory: kubernetes
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Run govulncheck on the systemd plugin
        working-directory: systemd
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
