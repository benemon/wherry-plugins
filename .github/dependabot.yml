version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /nomad
    schedule:
      interval: weekly
    groups:
      go-nomad:
        patterns: ["*"]
    ignore:
      # nomad/api publishes no module tags, so it is pinned at a
      # pseudo-version dependabot cannot resolve; bump it by hand.
      - dependency-name: github.com/hashicorp/nomad/api

  - package-ecosystem: gomod
    directory: /kubernetes
    schedule:
      interval: weekly
    groups:
      go-kubernetes:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/kubernetes, /kubernetes/test/e2e/agent]
    schedule:
      interval: weekly
    groups:
      images-kubernetes:
        patterns: ["*"]
