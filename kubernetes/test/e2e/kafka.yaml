# A single-node Kafka 4.3 as the operator guide's Prepare Kafka and Strimzi sections require: KRaft, share groups,
# SCRAM-SHA-512 over TLS, simple authorization with kafka-admin a super user, and wherry.operator. Receivers use the
# internal tls listener; the runner uses external through the node ports kind.yaml maps to localhost.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  labels: {strimzi.io/cluster: wherry-kafka}
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - {id: 0, type: persistent-claim, size: 2Gi, kraftMetadata: shared}
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: wherry-kafka
spec:
  kafka:
    version: 4.3.1
    metadataVersion: 4.3-IV0
    listeners:
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication: {type: scram-sha-512}
      - name: external
        port: 9094
        type: nodeport
        tls: true
        authentication: {type: scram-sha-512}
        configuration:
          bootstrap: {nodePort: 31092, alternativeNames: [localhost]}
          brokers:
            - {broker: 0, advertisedHost: localhost, advertisedPort: 31093, nodePort: 31093}
    authorization:
      type: simple
      superUsers: [kafka-admin]
    config:
      auto.create.topics.enable: false
      connections.max.reauth.ms: 600000
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      share.coordinator.state.topic.replication.factor: 1
      share.coordinator.state.topic.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    userOperator: {}
    template:
      userOperatorContainer:
        env:
          - {name: STRIMZI_IGNORED_USERS_PATTERN, value: '^wherry\.(tnt|rcv)\..+'}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: kafka-admin
  labels: {strimzi.io/cluster: wherry-kafka}
spec:
  authentication: {type: scram-sha-512}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: wherry.operator
  labels: {strimzi.io/cluster: wherry-kafka}
spec:
  authentication: {type: scram-sha-512}
  authorization:
    type: simple
    acls:
      - resource: {type: topic, name: wherry.admin, patternType: literal}
        operations: [Read, Write, Describe]
