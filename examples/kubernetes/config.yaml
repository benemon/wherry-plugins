# The receiver's local configuration. kustomization.yaml generates the ConfigMap wherry-receiver-config from it, which
# receiver.yaml mounts at /etc/wherry/config, and the Secret wherry-receiver-bundle from receiver.bundle, mounted at
# /etc/wherry/bundle. state_dir is on the state claim at /var/lib/wherry. The image installs the plugins in plugin_dir.
bundle: /etc/wherry/bundle/bundle.yaml
# For a broker under a private CA: the ConfigMap wherry-receiver-kafka-ca, which kustomization.yaml generates from
# kafka-ca.crt and receiver.yaml mounts at /etc/wherry/kafka-ca. Unset, the system roots.
# ca_file: /etc/wherry/kafka-ca/ca.crt
state_dir: /var/lib/wherry/state
plugin_dir: /usr/local/libexec/wherry/plugins
metrics_addr: ":9464"
# A stop takes up to drain_timeout plus 5 seconds, so drain_timeout stays at least 10 seconds below receiver.yaml's
# terminationGracePeriodSeconds, 30.
drain_timeout: 20s
# In the cluster the plugin authenticates as the receiver's service account, so no profile names a platform
# credential. A platform credential, such as a token for another cluster, comes from a Secret mounted with defaultMode
# 0440 or stricter, under the name the plugin's config gives in its credential key:
# credentials:
#   cluster-token:
#     file: /etc/wherry/cluster-token/token
