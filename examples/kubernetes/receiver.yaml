# The in-cluster receiver. apply.sh applies this file unchanged but for the namespace and the image, on Kubernetes and
# OpenShift alike, beside the Secret wherry-receiver-bundle and the ConfigMap wherry-receiver-config, which holds the
# receiver's local configuration config.yaml. Agent pods run in the same namespace and mount the runs claim with the
# receiver.
apiVersion: v1
kind: ServiceAccount
metadata: {name: wherry-receiver}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: wherry-receiver}
rules:
  - {apiGroups: [""], resources: [pods], verbs: [create, get, list, watch, delete]}
  - {apiGroups: [""], resources: [pods/log], verbs: [get]}
  - {apiGroups: [""], resources: [secrets], verbs: [create, get, update, delete, list]}
  # A Role grants get on its own namespace alone.
  - {apiGroups: [""], resources: [namespaces], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: wherry-receiver}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: wherry-receiver}
subjects:
  - {kind: ServiceAccount, name: wherry-receiver, namespace: wherry}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: wherry-receiver-state}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
# Every run's inputs and outputs; size it for the receiver's capacity and the pool's output limits.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: wherry-runs}
spec:
  accessModes: [ReadWriteMany]
  resources: {requests: {storage: 10Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: wherry-receiver}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: wherry-receiver}}
  template:
    metadata: {labels: {app: wherry-receiver}}
    spec:
      serviceAccountName: wherry-receiver
      # config.yaml's drain_timeout, 25 seconds, stays below this window.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: receiver
          image: wherry-receiver
          args: [receiver, run, --config-file, /etc/wherry/config/config.yaml]
          env:
            - {name: TMPDIR, value: /tmp}
            - {name: HOME, value: /tmp}
          ports: [{name: metrics, containerPort: 9464}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 512Mi}}
          volumeMounts:
            - {name: config, mountPath: /etc/wherry/config, readOnly: true}
            - {name: bundle, mountPath: /etc/wherry/bundle, readOnly: true}
            - {name: state, mountPath: /var/lib/wherry}
            - {name: runs, mountPath: /var/lib/wherry/runs}
            - {name: tmp, mountPath: /tmp}
            # For a storage endpoint under a private CA; see wherry-receiver-ca below.
            # - {name: ca, mountPath: /etc/pki/ca-trust/extracted/pem, readOnly: true}
      volumes:
        - {name: config, configMap: {name: wherry-receiver-config}}
        - {name: bundle, secret: {secretName: wherry-receiver-bundle, defaultMode: 0440}}
        - {name: state, persistentVolumeClaim: {claimName: wherry-receiver-state}}
        - {name: runs, persistentVolumeClaim: {claimName: wherry-runs}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 16Mi}}
        # - {name: ca, configMap: {name: wherry-receiver-ca, items: [{key: ca-bundle.crt, path: tls-ca-bundle.pem}]}}
# ---
# Optional, for a storage endpoint under a private CA; a public CA needs none of this. On OpenShift the label fills
# ca-bundle.crt with the cluster's trusted CAs. On other Kubernetes, drop the label and set ca-bundle.crt to the
# system roots and the private CA, since the mount replaces the image's bundle. Uncomment the ca volume and mount in
# the Deployment as well.
# apiVersion: v1
# kind: ConfigMap
# metadata:
#   name: wherry-receiver-ca
#   labels: {config.openshift.io/inject-trusted-cabundle: "true"}
---
apiVersion: v1
kind: Service
metadata: {name: wherry-receiver-metrics, labels: {app: wherry-receiver}}
spec:
  selector: {app: wherry-receiver}
  ports: [{name: metrics, port: 9464, targetPort: metrics}]
