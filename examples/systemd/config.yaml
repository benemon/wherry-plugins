# The receiver's local configuration, at /etc/wherry/config.yaml for wherry-receiver.service.
# bundle is the credential the unit's LoadCredential=bundle: loads, at the path systemd gives a credential of
# wherry-receiver.service; a unit of another name has another path.
# state_dir sits under the unit's StateDirectory, which ProtectSystem=strict leaves writable.
# The systemd plugin refuses a platform credential, so this configuration has no credentials.
bundle: /run/credentials/wherry-receiver.service/bundle
# For a broker under a private CA, a file of its certificates. Unset, the system roots.
# ca_file: /etc/wherry/kafka-ca.pem
state_dir: /var/lib/wherry/state
plugin_dir: /usr/local/libexec/wherry/plugins
metrics_addr: ":9464"
# A stop takes up to drain_timeout plus 5 seconds, so drain_timeout stays at least 10 seconds below the unit's
# TimeoutStopSec, 30 seconds.
drain_timeout: 20s
